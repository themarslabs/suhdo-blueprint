name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      authentication:
        description: Authentication method for npm
        required: true
        default: npm-token
        type: choice
        options:
          - npm-token
          - trusted-publisher

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify npm token
        if: inputs.authentication == 'npm-token'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Publish initial package with npm token
        if: inputs.authentication == 'npm-token'
        run: npm publish --workspace @suhdo/ui-blueprint
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publisher
        if: inputs.authentication == 'trusted-publisher'
        run: npm publish --workspace @suhdo/ui-blueprint
